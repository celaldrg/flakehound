name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: End-to-end on the demo project
        run: |
          go build -o flakehound .
          cd examples/demo
          ../../flakehound run -n 8 -label ci -history /tmp/fh.jsonl -- go test -json -count=1 ./...
          ../../flakehound report -history /tmp/fh.jsonl -format json | grep -q '"verdict"'
